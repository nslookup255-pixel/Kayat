[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kayat"
version = "0.0.3"
description = "A Python-first desktop GUI framework powered by HTML and CSS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name" }
]

dependencies = []

[tool.setuptools.packages.find]
include = ["kayat*"]